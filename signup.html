<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | VISTRAL UPVC Architectural Systems</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bronze: { DEFAULT: '#B68B58', 600: '#9E7443' },
            charcoal: { DEFAULT: '#202A32', light: '#2C3843' },
            ivory: { DEFAULT: '#F7F6F1' }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-ivory dark:bg-[#12181F] text-charcoal dark:text-stone-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 relative overflow-x-hidden font-sans">
  
  <!-- Architectural Background -->
  <div class="absolute inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1499955085172-a104c9463ece?auto=format&fit=crop&w=2000&q=85" 
         alt="Architectural Interior Glazing" 
         class="w-full h-full object-cover filter brightness-[0.25]">
    <div class="absolute inset-0 bg-charcoal/70 backdrop-blur-sm"></div>
  </div>

  <!-- Auth Layout Container -->
  <div class="relative z-10 w-full max-w-lg my-auto">
    <!-- Top Controls: Out of the card on mobile, fixed in top corner on desktop -->
    <div class="flex items-center justify-end space-x-3 rtl:space-x-reverse mb-3 sm:mb-0 sm:fixed sm:top-6 sm:right-6 rtl:sm:right-auto rtl:sm:left-6 z-20">
      <button class="rtl-toggle p-2 rounded-full border border-white/20 hover:border-bronze transition-all text-stone-200 hover:text-bronze flex items-center justify-center bg-charcoal/40 sm:bg-transparent backdrop-blur-sm shadow-sm" title="Toggle Layout Direction (LTR / RTL)" aria-label="Toggle Layout Direction">
        <svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>
        </svg>
      </button>
      <button class="theme-toggle p-2 rounded-full border border-white/20 text-white hover:border-bronze bg-charcoal/40 sm:bg-transparent backdrop-blur-sm shadow-sm" aria-label="Toggle Theme">
        <i data-lucide="moon" class="theme-icon w-4 h-4"></i>
      </button>
    </div>

    <!-- Centered Modern Sign Up Card -->
    <div class="w-full p-8 sm:p-10 rounded-3xl bg-white dark:bg-[#182029] border border-charcoal/10 dark:border-white/10 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex items-center space-x-2.5 group rtl:space-x-reverse">
        <img src="assets/logo.svg" alt="VISTRAL Logo" class="w-10 h-10 transform group-hover:scale-105 transition-transform">
        <div class="text-left rtl:text-right">
          <span class="font-display font-extrabold text-2xl uppercase tracking-tight text-charcoal dark:text-white block leading-none">VISTRAL</span>
          <span class="text-[9px] tracking-[0.25em] text-bronze uppercase font-bold">UPVC Systems</span>
        </div>
      </a>
      <h2 class="font-display text-xl font-bold text-charcoal dark:text-white pt-2">Create Architectural Account</h2>
      <p class="text-xs text-charcoal/60 dark:text-stone-400">Join our partner network for CAD elevations, specifications & direct quotes.</p>
    </div>

    <!-- Sign Up Form -->
    <form id="signupForm" class="space-y-4">
      <!-- First Name -->
      <div>
        <label class="block text-xs uppercase font-bold tracking-wider text-charcoal/80 dark:text-stone-300 mb-1.5">First Name *</label>
        <input type="text" required placeholder="Marcus" class="w-full px-4 py-3 rounded-xl border border-charcoal/20 dark:border-white/20 bg-ivory dark:bg-[#12181F] text-xs text-charcoal dark:text-white focus:outline-none focus:border-bronze">
      </div>

      <!-- Last Name -->
      <div>
        <label class="block text-xs uppercase font-bold tracking-wider text-charcoal/80 dark:text-stone-300 mb-1.5">Last Name *</label>
        <input type="text" required placeholder="Vance" class="w-full px-4 py-3 rounded-xl border border-charcoal/20 dark:border-white/20 bg-ivory dark:bg-[#12181F] text-xs text-charcoal dark:text-white focus:outline-none focus:border-bronze">
      </div>

      <!-- Email Address -->
      <div>
        <label class="block text-xs uppercase font-bold tracking-wider text-charcoal/80 dark:text-stone-300 mb-1.5">Email Address *</label>
        <input type="email" required placeholder="marcus@vancearchitects.com" class="w-full px-4 py-3 rounded-xl border border-charcoal/20 dark:border-white/20 bg-ivory dark:bg-[#12181F] text-xs text-charcoal dark:text-white focus:outline-none focus:border-bronze">
      </div>

      <!-- Phone Number -->
      <div>
        <label class="block text-xs uppercase font-bold tracking-wider text-charcoal/80 dark:text-stone-300 mb-1.5">Phone Number *</label>
        <input type="tel" required placeholder="+1 (555) 345-6789" class="w-full px-4 py-3 rounded-xl border border-charcoal/20 dark:border-white/20 bg-ivory dark:bg-[#12181F] text-xs text-charcoal dark:text-white focus:outline-none focus:border-bronze">
      </div>

      <!-- Password & Confirm Password -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase font-bold tracking-wider text-charcoal/80 dark:text-stone-300 mb-1.5">Password *</label>
          <div class="relative">
            <input id="signupPassword" type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-charcoal/20 dark:border-white/20 bg-ivory dark:bg-[#12181F] text-xs text-charcoal dark:text-white focus:outline-none focus:border-bronze">
            <button type="button" class="password-toggle-btn absolute right-3 rtl:right-auto rtl:left-3 top-2.5 text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 p-1" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-xs uppercase font-bold tracking-wider text-charcoal/80 dark:text-stone-300 mb-1.5">Confirm Password *</label>
          <div class="relative">
            <input id="signupConfirmPassword" type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-charcoal/20 dark:border-white/20 bg-ivory dark:bg-[#12181F] text-xs text-charcoal dark:text-white focus:outline-none focus:border-bronze">
            <button type="button" class="password-toggle-btn absolute right-3 rtl:right-auto rtl:left-3 top-2.5 text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 p-1" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Terms & Conditions checkbox -->
      <div class="pt-1">
        <label class="flex items-start space-x-2 text-xs text-charcoal/70 dark:text-stone-300 rtl:space-x-reverse cursor-pointer">
          <input type="checkbox" required class="rounded text-bronze focus:ring-bronze mt-0.5">
          <span>I agree to the <a href="#" class="text-bronze underline">Terms & Conditions</a> and <a href="#" class="text-bronze underline">Privacy Policy</a> of VISTRAL Systems.</span>
        </label>
      </div>

      <!-- Create Account Button -->
      <button type="submit" class="w-full bronze-gradient-btn py-3.5 rounded-xl text-xs uppercase font-bold tracking-wider shadow-lg">
        Create Account
      </button>
    </form>

    <!-- Social Divider -->
    <div class="relative flex items-center justify-center">
      <div class="border-t border-charcoal/10 dark:border-white/10 w-full"></div>
      <span class="bg-white dark:bg-[#182029] px-3 text-[11px] uppercase tracking-wider text-charcoal/50 dark:text-stone-400 whitespace-nowrap">Or sign up with</span>
      <div class="border-t border-charcoal/10 dark:border-white/10 w-full"></div>
    </div>

    <!-- Icon-Only Social Buttons (Google, Apple, Facebook) -->
    <div class="grid grid-cols-3 gap-3">
      <!-- Google -->
      <button type="button" onclick="alert('Google SSO registration active.');" class="py-2.5 rounded-xl border border-charcoal/20 dark:border-white/20 hover:border-bronze flex items-center justify-center text-charcoal dark:text-stone-200 hover:bg-charcoal/5 dark:hover:bg-white/5 transition-all" title="Sign up with Google" aria-label="Sign up with Google">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.9z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z"/>
          <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
        </svg>
      </button>

      <!-- Apple -->
      <button type="button" onclick="alert('Apple ID registration active.');" class="py-2.5 rounded-xl border border-charcoal/20 dark:border-white/20 hover:border-bronze flex items-center justify-center text-charcoal dark:text-stone-200 hover:text-black dark:hover:text-white hover:bg-charcoal/5 dark:hover:bg-white/5 transition-all" title="Sign up with Apple" aria-label="Sign up with Apple">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 1.01-2.87-.96.04-2.13.64-2.79 1.41-.58.68-1.1 1.74-.96 2.79 1.07.08 2.12-.58 2.74-1.33z"/>
        </svg>
      </button>

      <!-- Facebook -->
      <button type="button" onclick="alert('Facebook registration active.');" class="py-2.5 rounded-xl border border-charcoal/20 dark:border-white/20 hover:border-bronze flex items-center justify-center text-charcoal dark:text-stone-200 hover:bg-charcoal/5 dark:hover:bg-white/5 transition-all" title="Sign up with Facebook" aria-label="Sign up with Facebook">
        <svg class="w-5 h-5 fill-[#1877F2]" viewBox="0 0 24 24">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </button>
    </div>

    <!-- Login redirect link -->
    <div class="text-center text-xs text-charcoal/70 dark:text-stone-400 pt-2">
      Already have a client account? 
      <a href="login.html" class="text-bronze font-bold hover:underline">Log in here</a>
    </div>
  </div>
</div>

  <script src="js/main.js"></script>
</body>
</html>
